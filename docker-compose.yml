services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ingressos
      POSTGRES_USER: ingressos
      POSTGRES_PASSWORD: local-ingressos-db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingressos -d ingressos"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://ingressos:local-ingressos-db@db:5432/ingressos
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
